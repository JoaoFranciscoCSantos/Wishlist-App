<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>

    <h1>Editar item da wishlist</h1>

    <form action="{{ url_for('edit_item', item_id=item.id) }}" method="POST">
        <input type="text" name="name" value="{{ item.name }}" required>
        <select name="category">
            <option value="objeto" {% if item.category == "objeto" %}selected{% endif %}>Objeto</option>
            <option value="viagem" {% if item.category == "viagem" %}selected{% endif %}>Viagem</option>
            <option value="interesse" {% if item.category == "interesse" %}selected{% endif %}>Interesse</option>
        </select>        
        <input type="number" step="0.01" name="price" value="{{ item.price if item.price is not none else '' }}" placeholder="Preço (opcional)">
        <input type="url" name="url" value="{{ item.url or '' }}" placeholder="Link (opcional)">

        <input type="url" name="image_url" id="image_url" value="{{ item.image_url or '' }}" placeholder="Link da imagem (opcional)">
        {% if item.image_url %}
            <img src="{{ item.image_url }}" id="preview" class="item-img" style="max-width:150px;">
        {% else %}
            <img id="preview" class="item-img" style="max-width:150px; display:none;">
        {% endif %}

        <textarea name="notes" placeholder="Notas (opcional)">{{ item.notes or '' }}</textarea>
        <select name="priority">
            <option value="1" {% if item.priority == 1 %}selected{% endif %}>1</option>
            <option value="2" {% if item.priority == 2 %}selected{% endif %}>2</option>
            <option value="3" {% if item.priority == 3 %}selected{% endif %}>3</option>     
            <option value="4" {% if item.priority == 4 %}selected{% endif %}>4</option>
            <option value="5" {% if item.priority == 5 %}selected{% endif %}>5</option>
        </select>
        <button type="submit">Guardar alterações</button>
    </form>

    <a href="{{ url_for('index') }}">← Voltar à lista</a>

    <script>
        const input = document.getElementById("image_url");
        const preview = document.getElementById("preview");
        input.addEventListener("input", () => {
            if (input.value) {
                preview.src = input.value;
                preview.style.display = "block";
            } else {
                preview.style.display = "none";
            }
        });
    </script>

</body>
</html>
